name: CI

on:
  pull_request:
  push:
    branches:
      - build-v1
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Application and test code.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      # CI=true makes this fail instead of silently skipping the printer-inspection helper.
      - run: npm run build:native
      - run: npm run build:app
      # Browser tests of the editor and dialogs (no printer, no Electron window).
      - run: npx playwright install chromium
      - run: npm run test:ui
      # The real app: IPC, settings, close prompt, font access, navigation guards.
      - run: npm run test:electron
      - name: Keep test traces when something failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.name }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
