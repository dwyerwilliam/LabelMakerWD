name: Build installers and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: win
            arch: x64
            pattern: releases/artifacts/*.exe
          - name: macos-arm64
            os: macos-15
            target: mac
            arch: arm64
            pattern: releases/artifacts/*-arm64.dmg
          - name: macos-x64
            os: macos-15-intel
            target: mac
            arch: x64
            pattern: releases/artifacts/*-x64.dmg

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:native
      - run: npm run build:app
      - name: Check Electron startup
        run: npm run test:electron
      - name: Package installer
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Starts the packaged app itself (fuses, protocol, bundled helper, font access).
      # macOS packages are untested, so a failure there is reported without blocking the release yet.
      - name: Smoke-test the packaged app
        run: npm run test:packaged
        continue-on-error: ${{ matrix.target == 'mac' }}
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: label-maker-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME does not match package version $version"; exit 1; }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: installers
          merge-multiple: true
      - name: Validate and checksum installers
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          cd installers
          test -f "LabelMaker-Setup-${version}.exe"
          test -f "Label Maker-${version}-arm64.dmg"
          test -f "Label Maker-${version}-x64.dmg"
          sha256sum "LabelMaker-Setup-${version}.exe" "Label Maker-${version}-arm64.dmg" "Label Maker-${version}-x64.dmg" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes installers/*.exe installers/*.dmg installers/SHA256SUMS.txt
