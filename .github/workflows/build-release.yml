name: Build installers and release

# One workflow builds and tests the three installers and, when asked, publishes them as a
# GitHub release. Each release is marked Latest and stays on the Releases page, which is
# the version history.
#
# - Actions > "Build installers and release" > Run workflow on main, with "Publish a
#   release" ticked: works out the next version from the latest release tag (or takes an
#   exact one), builds with it, then creates the tag and the release. Nothing is committed.
# - Run workflow without the tick (any branch): builds installers as Actions artifacts only.
# - Pushing a tag vX.Y.Z still works and releases that version.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (main only). Unticked = build installers as artifacts only.
        type: boolean
        default: false
      bump:
        description: Part of the version to raise from the latest release
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: Exact version instead of a bump, for example 1.0.0 or 1.1.0-beta.1 (optional)
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never run two releases at once: both could pick the same next version.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      previous: ${{ steps.pick.outputs.previous }}
      publish: ${{ steps.pick.outputs.publish }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Pick the version
        id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.release }}
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          if [ "$EVENT" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            publish=true
          else
            publish="${PUBLISH_INPUT:-false}"
            if [ "$publish" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Releases are published from main only (this run is on $GITHUB_REF_NAME)."
              exit 1
            fi
            latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
            if [ -n "${EXACT:-}" ]; then
              version="${EXACT#v}"
            elif [ -z "$latest" ]; then
              # First release: use the version already in package.json.
              version=$(node -p "require('./package.json').version")
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              case "$BUMP" in
                major) version="$((major + 1)).0.0" ;;
                minor) version="${major}.$((minor + 1)).0" ;;
                *)     version="${major}.${minor}.$((patch + 1))" ;;
              esac
            fi
            tag="v$version"
            if [ "$publish" = "true" ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists. Choose another version."
              exit 1
            fi
          fi

          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi

          # The release notes start from the latest stable release before this one.
          previous=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$tag" | head -n1 || true)
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "previous=$previous"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Label Maker $version"
            echo "- Tag: \`$tag\`"
            echo "- Publish release: $publish"
            echo "- Previous release: ${previous:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: win
            arch: x64
            pattern: releases/artifacts/*.exe
          - name: macos-arm64
            os: macos-15
            target: mac
            arch: arm64
            pattern: releases/artifacts/*-arm64.dmg
          - name: macos-x64
            os: macos-15-intel
            target: mac
            arch: x64
            pattern: releases/artifacts/*-x64.dmg

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The release version is set here, in the build only; package.json in the repository is not changed.
      - name: Set version ${{ needs.version.outputs.version }}
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:native
      - run: npm run build:app
      - name: Check Electron startup
        run: npm run test:electron
      - name: Package installer
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Starts the packaged app itself (fuses, protocol, bundled helper, font access).
      # macOS packages are untested, so a failure there is reported without blocking the release yet.
      - name: Smoke-test the packaged app
        run: npm run test:packaged
        continue-on-error: ${{ matrix.target == 'mac' }}
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: label-maker-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release ${{ needs.version.outputs.tag }}
    if: needs.version.outputs.publish == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true
      - name: Validate and checksum installers
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd installers
          files=("LabelMaker-Setup-${VERSION}.exe" "LabelMaker-${VERSION}-arm64.dmg" "LabelMaker-${VERSION}-x64.dmg")
          for f in "${files[@]}"; do test -f "$f" || { echo "::error::Missing installer $f"; ls -la; exit 1; }; done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Write the release notes header
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > notes.md <<EOF
          ## Downloads

          | Platform | Installer |
          |---|---|
          | Windows 11 (x64) | [LabelMaker-Setup-${VERSION}.exe](${base}/LabelMaker-Setup-${VERSION}.exe) |
          | macOS, Apple silicon | [LabelMaker-${VERSION}-arm64.dmg](${base}/LabelMaker-${VERSION}-arm64.dmg) |
          | macOS, Intel | [LabelMaker-${VERSION}-x64.dmg](${base}/LabelMaker-${VERSION}-x64.dmg) |

          The installers are not signed, so Windows and macOS warn on first run; see the [README](https://github.com/${GITHUB_REPOSITORY}#downloads). macOS support is still experimental. Check downloads against \`SHA256SUMS.txt\`.

          EOF
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --title "Label Maker $VERSION" --notes-file notes.md --generate-notes)
          # A pushed tag already exists; otherwise the release creates the tag on the commit that was built.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then args+=(--verify-tag); else args+=(--target "$GITHUB_SHA"); fi
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "$PREVIOUS"); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          gh release create "$TAG" "${args[@]}" \
            "installers/LabelMaker-Setup-${VERSION}.exe" \
            "installers/LabelMaker-${VERSION}-arm64.dmg" \
            "installers/LabelMaker-${VERSION}-x64.dmg" \
            installers/SHA256SUMS.txt
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
